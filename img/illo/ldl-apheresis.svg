<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="脂蛋白分離術與反彈曲線插圖">
  <rect x="4" y="4" width="88" height="88" rx="18" fill="#fbeae7"/>
  <!-- axes -->
  <line x1="20" y1="74" x2="80" y2="74" stroke="#c9b8b4" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="20" y2="74" stroke="#c9b8b4" stroke-width="2" stroke-linecap="round"/>
  <!-- baseline (untreated) -->
  <line x1="20" y1="30" x2="80" y2="30" stroke="#c9b8b4" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- apheresis rebound curve: drop then back up -->
  <path d="M20 30 L20 66 C34 66 40 40 58 33 C68 30 74 30 80 30" fill="none" stroke="#c43d34" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="66" r="3.4" fill="#c43d34"/>
  <!-- drug: low steady plateau -->
  <path d="M20 30 C30 30 34 58 44 58 L80 58" fill="none" stroke="#2e9e5b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
